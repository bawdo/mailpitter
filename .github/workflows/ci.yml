name: CI

permissions:
  contents: read

# Releases are triggered by release.yml, which calls this workflow.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VULN_VERSION: v1.9.0
  # The caddy_shack release the integration job installs. Bump it here.
  CADDY_SHACK_VERSION: 0.1.0
  # The runner image ships an older shellcheck that disagrees with current
  # releases, so the lint step installs this version and checks its digest.
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  # Formatting, lint and vulnerability checks are pure Go and OS-independent, so they run once on cheap Linux.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Check changelog and docs
        run: |
          scripts/changelog.sh check
          scripts/docs-check.sh
          make test-scripts

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" scripts/*.sh

      - name: Check formatting (gofmt -s)
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need 'gofmt -s -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Must be built with a Go at least as new as the setup-go version
          # above, or it cannot type-check the standard library. Bump it
          # with Go. Dependabot does not track this input.
          version: v2.15.0
          args: --timeout=5m

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.VULN_VERSION }} ./...

  # Runs the race-detector suite with coverage on Linux and macOS because the tool targets both, and uploads coverage from Linux only.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (race detector, coverage)
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false
          verbose: true

  # Exercises the Docker-backed integration suite, which needs a Docker daemon that only the Linux runners provide.
  # The suite drives the real caddy_shack and mailpitter binaries, so both are installed first and the strict
  # variable turns a missing prerequisite into a failure rather than a skip.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Verify docker
        run: docker info

      - name: Install caddy_shack ${{ env.CADDY_SHACK_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="caddy_shack_${CADDY_SHACK_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/cs" "$RUNNER_TEMP/bin"
          gh release download "v${CADDY_SHACK_VERSION}" --repo bawdo/caddy_shack \
            --pattern "$archive" --pattern checksums.txt --dir "$RUNNER_TEMP/cs"
          cd "$RUNNER_TEMP/cs"
          gh attestation verify "$archive" --repo bawdo/caddy_shack \
            --signer-workflow bawdo/caddy_shack/.github/workflows/release.yml \
            --source-ref "refs/tags/v${CADDY_SHACK_VERSION}"
          sha256sum -c checksums.txt --ignore-missing
          tar -xzf "$archive"
          install -m 0755 "caddy_shack_${CADDY_SHACK_VERSION}_linux_amd64/caddy_shack" "$RUNNER_TEMP/bin/caddy_shack"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Start caddy_shack
        run: |
          set -euo pipefail
          caddy_shack version
          caddy_shack install
          caddy_shack status

      - name: Install mailpitter
        run: |
          set -euo pipefail
          make install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Strict mode fails on a missing prerequisite; the grep fails when the
      # suite ran nothing at all, so neither path can leave this job green
      # without the round trip having run.
      - name: Run integration tests
        env:
          MAILPITTER_INTEGRATION_STRICT: "1"
        run: |
          set -euo pipefail
          make integration 2>&1 | tee "$RUNNER_TEMP/integration.log"
          grep -q -- '--- PASS: TestMailpitterRoundTrip' "$RUNNER_TEMP/integration.log"

  # Builds through the Makefile and smoke-tests the binary on Linux, since the build is platform-independent Go and the Makefile owns the ldflags.
  build:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build mailpitter binary
        run: make build

      - name: CLI smoke test (mailpitter version)
        run: |
          output=$(./bin/mailpitter version)
          echo "$output"
          if ! echo "$output" | head -1 | grep -q '^mailpitter '; then
            echo "Smoke test failed: 'mailpitter version' did not print build identity"
            exit 1
          fi
